name: Direct Open - GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare site
        shell: bash
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            if node -e "const p=require('./package.json'); process.exit(p.scripts&&p.scripts.build?0:1)"; then
              if node -e "const p=require('./package.json'); process.exit((p.dependencies&&p.dependencies.vite)||(p.devDependencies&&p.devDependencies.vite)?0:1)"; then npm run build -- --base=./; else npm run build; fi
            fi
          fi
          if [ -d dist ]; then cp -a dist/. _site/; elif [ -d build ]; then cp -a build/. _site/; elif [ -d out ]; then cp -a out/. _site/; else rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='_site' ./ _site/; fi
          if [ ! -f _site/index.html ]; then printf '%s\n' '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repository</title><style>body{font-family:Arial,sans-serif;background:#081525;color:#eef6ff;padding:32px;line-height:1.6}</style><h1>Repository available</h1><p>This repository does not contain a directly runnable index page.</p>' > _site/index.html; fi
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
